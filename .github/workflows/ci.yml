name: ci

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # git preserves the executable bit, but a tarball checkout or a future
      # export step would not, and every suite shells into these.
      - name: Make the payload executable
        run: chmod +x bin/* hooks/*.sh hooks/*.py tests/*.sh tests/*.py
      # One entry point, the same one run locally. Enumerating the suites here
      # instead is what let CI drift on the first push: the policy step ran
      # without AWAY_HOME and went looking for an install in the runner's home.
      - name: All suites
        run: bash tests/run_all.sh
